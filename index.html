<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Habits</title>

<!-- Wichtig für iOS "Zum Home-Bildschirm": macht die App vollbildig ohne Safari-Leiste -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#F6F1E7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
  :root{
    --paper: #F6F1E7;
    --paper-line: #E4DAC4;
    --ink: #2B2A28;
    --ink-soft: #6B665C;
    --accent: #34506B;
    --accent-soft: #A9C0CE;
    --done: #34506B;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(transparent, transparent 34px, var(--paper-line) 34px, var(--paper-line) 35px);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header{
    padding: 28px 20px 10px;
  }

  h1{
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .sub{
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 4px;
  }

  .tabs{
    display:flex;
    gap: 6px;
    padding: 14px 20px 6px;
  }
  .tab{
    border:none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor:pointer;
  }
  .tab.active{
    background: var(--accent);
    color: var(--paper);
  }

  main{ padding: 6px 20px 120px; }

  .week-header{
    display:grid;
    grid-template-columns: 1fr repeat(7, 34px);
    gap: 6px;
    padding: 6px 4px;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .week-header span:not(:first-child){ text-align:center; }

  .habit-row{
    display:grid;
    grid-template-columns: 1fr repeat(7, 34px);
    align-items:center;
    gap: 6px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--paper-line);
  }
  .habit-name{
    font-size: 15px;
    font-weight: 600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding-right: 6px;
  }
  .dot{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--accent-soft);
    background: transparent;
    margin: 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  .dot:active{ transform: scale(0.88); }
  .dot.done{
    background: var(--done);
    border-color: var(--done);
  }
  .dot.done::after{
    content:"";
    width: 10px;
    height: 6px;
    border-left: 2px solid var(--paper);
    border-bottom: 2px solid var(--paper);
    transform: rotate(-45deg) translateY(-1px);
  }
  .dot.today{ box-shadow: 0 0 0 2px var(--accent) inset; }

  .month-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .month-day-label{
    text-align:center;
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .month-cell{
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1.5px solid var(--paper-line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    color: var(--ink-soft);
    cursor:pointer;
    position:relative;
  }
  .month-cell.empty{ visibility:hidden; }
  .month-cell.today{ border-color: var(--accent); }
  .month-cell .fill{
    position:absolute;
    inset:0;
    border-radius: 6px;
    background: var(--done);
    opacity: 0;
  }
  .month-cell.done .fill{ opacity: 0.85; }
  .month-cell.done{ color: var(--paper); }
  .month-cell .num{ position: relative; z-index: 1; }

  .habit-block{ margin-bottom: 26px; }
  .habit-block-title{
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px 0;
  }
  .month-nav button{
    border:none; background:none; font-size:20px; color:var(--accent);
    padding: 4px 10px; cursor:pointer;
  }
  .month-nav .label{ font-weight:700; font-size:15px; }

  .empty-state{
    text-align:center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.5;
  }

  .fab{
    position: fixed;
    right: 20px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--paper);
    border:none;
    font-size: 28px;
    box-shadow: 0 6px 16px rgba(52,80,107,0.35);
    cursor:pointer;
  }

  dialog{
    border:none;
    border-radius: 14px;
    padding: 0;
    background: var(--paper);
    width: min(320px, 88vw);
  }
  dialog::backdrop{ background: rgba(43,42,40,0.35); }
  .dialog-inner{ padding: 20px; }
  .dialog-inner h2{ margin:0 0 12px; font-size:17px; font-family: Georgia, serif; }
  .dialog-inner input{
    width:100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--paper-line);
    background: white;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .dialog-actions{ display:flex; justify-content:flex-end; gap: 10px; }
  .dialog-actions button{
    border:none; background:none; font-size:15px; font-weight:600; padding: 6px 4px; cursor:pointer;
  }
  .dialog-actions .cancel{ color: var(--ink-soft); }
  .dialog-actions .save{ color: var(--accent); }

  .swipe-hint{ font-size: 11px; color: var(--ink-soft); text-align:center; margin-top: 14px; }
</style>
</head>
<body>

<header>
  <h1>Habits</h1>
  <div class="sub" id="dateLabel"></div>
</header>

<div class="tabs">
  <button class="tab active" data-view="week">Woche</button>
  <button class="tab" data-view="month">Monat</button>
</div>

<main id="main"></main>

<button class="fab" id="addBtn">+</button>

<dialog id="addDialog">
  <div class="dialog-inner">
    <h2>Neuer Habit</h2>
    <input id="habitInput" placeholder="z. B. Wasser trinken" maxlength="40">
    <div class="dialog-actions">
      <button class="cancel" id="cancelBtn">Abbrechen</button>
      <button class="save" id="saveBtn">Hinzufügen</button>
    </div>
  </div>
</dialog>

<script>
// ---------- Datenhaltung ----------
const STORAGE_KEY = "habits_v1";

function loadHabits(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveHabits(habits){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

let habits = loadHabits(); // [{ id, name, dates: ["2026-08-21", ...] }]
let currentView = "week";
let monthCursor = new Date(); // für Monatsnavigation

function isoDay(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function toggleDate(habit, iso){
  const idx = habit.dates.indexOf(iso);
  if(idx >= 0) habit.dates.splice(idx,1);
  else habit.dates.push(iso);
  saveHabits(habits);
}

// ---------- Rendering: Woche ----------
const WEEKDAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];

function last7Days(){
  const days = [];
  const today = new Date();
  for(let i=6; i>=0; i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    days.push(d);
  }
  return days;
}

function renderWeek(container){
  const days = last7Days();
  const todayIso = isoDay(new Date());

  const header = document.createElement("div");
  header.className = "week-header";
  header.innerHTML = `<span></span>` + days.map(d=>`<span>${WEEKDAYS[d.getDay()]}</span>`).join("");
  container.appendChild(header);

  if(habits.length === 0){
    container.appendChild(emptyState());
    return;
  }

  habits.forEach(habit=>{
    const row = document.createElement("div");
    row.className = "habit-row";
    const nameEl = document.createElement("div");
    nameEl.className = "habit-name";
    nameEl.textContent = habit.name;
    row.appendChild(nameEl);

    days.forEach(d=>{
      const iso = isoDay(d);
      const dot = document.createElement("button");
      dot.className = "dot" + (habit.dates.includes(iso) ? " done" : "") + (iso===todayIso ? " today" : "");
      dot.addEventListener("click", ()=>{
        toggleDate(habit, iso);
        render();
      });
      row.appendChild(dot);
    });
    container.appendChild(row);
  });

  row_longpress_delete(container);
}

// Langes Drücken auf den Namen löscht den Habit (einfache Lösung ohne Wisch-Geste)
function row_longpress_delete(container){
  container.querySelectorAll(".habit-name").forEach((el, i)=>{
    let timer;
    const start = ()=>{ timer = setTimeout(()=>{
      if(confirm(`"${habits[i].name}" löschen?`)){
        habits.splice(i,1);
        saveHabits(habits);
        render();
      }
    }, 550); };
    const cancel = ()=> clearTimeout(timer);
    el.addEventListener("touchstart", start);
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchmove", cancel);
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", cancel);
    el.addEventListener("mouseleave", cancel);
  });
}

// ---------- Rendering: Monat ----------
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function renderMonth(container){
  const nav = document.createElement("div");
  nav.className = "month-nav";
  nav.innerHTML = `
    <button id="prevMonth">‹</button>
    <span class="label">${MONTH_NAMES[monthCursor.getMonth()]} ${monthCursor.getFullYear()}</span>
    <button id="nextMonth">›</button>
  `;
  container.appendChild(nav);

  if(habits.length === 0){
    container.appendChild(emptyState());
    nav.querySelector("#prevMonth").onclick = ()=>{ monthCursor.setMonth(monthCursor.getMonth()-1); render(); };
    nav.querySelector("#nextMonth").onclick = ()=>{ monthCursor.setMonth(monthCursor.getMonth()+1); render(); };
    return;
  }

  const year = monthCursor.getFullYear();
  const month = monthCursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const leadingEmpty = (firstDay.getDay() + 6) % 7; // Woche startet Montag
  const todayIso = isoDay(new Date());

  habits.forEach(habit=>{
    const block = document.createElement("div");
    block.className = "habit-block";
    const title = document.createElement("div");
    title.className = "habit-block-title";
    title.textContent = habit.name;
    block.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "month-grid";
    ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(l=>{
      const lab = document.createElement("div");
      lab.className = "month-day-label";
      lab.textContent = l;
      grid.appendChild(lab);
    });

    for(let i=0;i<leadingEmpty;i++){
      const empty = document.createElement("div");
      empty.className = "month-cell empty";
      grid.appendChild(empty);
    }

    for(let day=1; day<=daysInMonth; day++){
      const date = new Date(year, month, day);
      const iso = isoDay(date);
      const cell = document.createElement("div");
      cell.className = "month-cell" + (habit.dates.includes(iso) ? " done" : "") + (iso===todayIso ? " today" : "");
      cell.innerHTML = `<div class="fill"></div><span class="num">${day}</span>`;
      cell.addEventListener("click", ()=>{
        toggleDate(habit, iso);
        render();
      });
      grid.appendChild(cell);
    }

    block.appendChild(grid);
    container.appendChild(block);
  });

  nav.querySelector("#prevMonth").onclick = ()=>{ monthCursor.setMonth(monthCursor.getMonth()-1); render(); };
  nav.querySelector("#nextMonth").onclick = ()=>{ monthCursor.setMonth(monthCursor.getMonth()+1); render(); };
}

function emptyState(){
  const el = document.createElement("div");
  el.className = "empty-state";
  el.textContent = "Noch keine Habits. Tippe unten rechts auf +, um deinen ersten anzulegen.";
  return el;
}

// ---------- Steuerung ----------
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(currentView === "week") renderWeek(main);
  else renderMonth(main);

  if(currentView === "week"){
    const hint = document.createElement("div");
    hint.className = "swipe-hint";
    hint.textContent = "Tipp: Name gedrückt halten, um einen Habit zu löschen";
    main.appendChild(hint);
  }
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    render();
  });
});

const dialog = document.getElementById("addDialog");
document.getElementById("addBtn").addEventListener("click", ()=>{
  document.getElementById("habitInput").value = "";
  dialog.showModal();
  document.getElementById("habitInput").focus();
});
document.getElementById("cancelBtn").addEventListener("click", ()=> dialog.close());
document.getElementById("saveBtn").addEventListener("click", ()=>{
  const name = document.getElementById("habitInput").value.trim();
  if(name){
    habits.push({ id: Date.now().toString(), name, dates: [] });
    saveHabits(habits);
    render();
  }
  dialog.close();
});

const dateLabel = document.getElementById("dateLabel");
dateLabel.textContent = new Date().toLocaleDateString("de-DE", { weekday:"long", day:"numeric", month:"long" });

render();
</script>
</body>
</html>
